# Zhimu owns its virtual host; application data lives outside releases.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    include /etc/nginx/snippets/zhimu-site.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chesshub.fun www.chesshub.fun;
    ssl_certificate /etc/letsencrypt/live/chesshub.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chesshub.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/snippets/zhimu-site.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name chesshub.fun www.chesshub.fun;
    location ^~ /.well-known/acme-challenge/ { root /var/www/zhimu-acme; }
    location / { return 301 https://$host$request_uri; }
}
