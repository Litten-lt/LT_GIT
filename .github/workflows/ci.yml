name: CI/CD

on:
  push:
    branches: [main, tmp-gobang]
    paths:
      - 'gobang-web/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, tmp-gobang]
    paths:
      - 'gobang-web/**'
      - '.github/workflows/**'

env:
  NODE_VERSION: '20'

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            gobang-web
            .github/workflows
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'gobang-web/package-lock.json'

      - name: Install frontend dependencies
        run: cd gobang-web && npm ci

      - name: TypeScript check
        run: cd gobang-web && npm run build

      - name: Run unit tests
        run: cd gobang-web && npm run test

      - name: Build server
        run: cd gobang-web/server && npm ci && npm run build

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            gobang-web
            .github/workflows
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'gobang-web/package-lock.json'

      - name: Install frontend dependencies
        run: cd gobang-web && npm ci

      - name: Build frontend
        run: cd gobang-web && npm run build

      - name: Deploy frontend to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ubuntu
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          source: "gobang-web/dist/*"
          target: "/var/www/chesshub/dist"
          strip_components: 0

      - name: Setup server build
        run: cd gobang-web/server && npm ci

      - name: Build server
        run: cd gobang-web/server && npm run build

      - name: Deploy server to production
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ubuntu
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          source: "gobang-web/server/dist/*"
          target: "/var/www/chesshub/server"
          strip_components: 0

      - name: Restart server
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ubuntu
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          command: "sudo nginx -s reload && cd /var/www/chesshub && pm2 restart gobang-server || pm2 start /var/www/chesshub/server/dist/index.js --name gobang-server"