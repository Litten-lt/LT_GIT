add_header X-Frame-Options SAMEORIGIN always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer-when-downgrade always;
gzip on;
gzip_types text/plain text/css application/json application/javascript image/svg+xml;
gzip_min_length 1000;
location = / { return 302 /zhimu/; }
location = /zhimu { return 301 /zhimu/; }
location ^~ /.well-known/acme-challenge/ { root /var/www/zhimu-acme; }
location ^~ /zhimu/ {
    proxy_pass http://127.0.0.1:3210;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    client_max_body_size 30m;
    proxy_read_timeout 60s;
}
# Retired website routes and APIs are not served.
location / { return 404; }
access_log /var/log/nginx/zhimu.access.log;
error_log /var/log/nginx/zhimu.error.log;
