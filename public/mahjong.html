<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173c2e">
  <title>知木 · 广东红中麻将</title>
  <link rel="stylesheet" href="./mahjong.css">
</head>
<body>
  <main class="table">
    <header>
      <a href="./chess.html">‹ 房间大厅</a><h1>广东红中麻将</h1>
      <div class="tools"><button id="sound" type="button" aria-pressed="false">开启语音</button><button id="fullscreen" type="button">横屏全屏</button></div>
    </header>
    <p class="rotate-hint">横放手机，牌面会更大。</p>
    <p id="fullscreen-hint" role="status" hidden></p>
    <div class="board">
      <div class="felt" id="felt"></div>
      <div class="table-center">
        <span id="remaining"></span>
        <div id="latest" aria-live="polite"></div>
      </div>
    </div>
    <div class="turn-status"><p id="message" role="status">正在连接牌桌…</p><span id="countdown" aria-label="本轮剩余秒数"></span></div>
    <div id="actions" aria-label="可用操作"></div>
    <div id="hand" aria-label="我的手牌"></div>
    <section id="result" hidden></section>
  </main>
  <script type="module" src="./mahjong.js"></script>
</body>
</html>
