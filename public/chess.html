<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="manifest" href="./mahjong.webmanifest">
  <link rel="apple-touch-icon" href="./mahjong-192.png">
  <title>知木 · 棋牌室</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./chess.css">
</head>
<body>
  <main class="chess-lobby">
    <a href="./">← 返回知木</a>
    <div class="chess-heading">
      <h1>棋牌室</h1>
      <button id="nickname" class="outline-button" hidden></button>
    </div>
    <p id="chess-status" role="status">正在加载房间…</p>
    <div class="chess-heading">
      <h2>房间列表</h2>
      <button id="new-room" class="primary" disabled>创建房间</button>
    </div>
    <ul id="rooms"></ul>
  </main>
  <dialog class="chess-dialog" id="name-dialog" aria-labelledby="name-title">
    <form id="player-name">
      <h2 id="name-title">修改昵称</h2>
      <label>我的昵称<input name="name" required maxlength="20" autocomplete="nickname" autofocus></label>
      <p class="dialog-message" role="alert"></p>
      <div class="chess-actions"><button type="button" class="outline-button" data-close>取消</button><button class="primary">保存</button></div>
    </form>
  </dialog>
  <dialog class="chess-dialog" id="create-dialog" aria-labelledby="create-title">
    <form id="create-room">
      <h2 id="create-title">创建房间</h2>
      <label>房间名称<input name="name" required maxlength="30" autofocus></label>
      <label>牌类<select name="game"><option value="mahjong">麻将</option></select></label>
      <label>麻将规则<select name="rule" required></select></label>
      <label>房间密码<input name="password" type="password" required maxlength="64" autocomplete="new-password"></label>
      <p class="dialog-message" role="alert"></p>
      <div class="chess-actions"><button type="button" class="outline-button" data-close>取消</button><button class="primary">创建房间</button></div>
    </form>
  </dialog>
  <dialog class="chess-dialog" id="join-dialog" aria-labelledby="join-title">
    <form id="join-room">
      <h2 id="join-title">加入房间</h2>
      <label>房间密码<input name="password" type="password" required maxlength="64" autocomplete="off" autofocus></label>
      <p class="dialog-message" role="alert"></p>
      <div class="chess-actions"><button type="button" class="outline-button" data-close>取消</button><button class="primary">加入房间</button></div>
    </form>
  </dialog>
  <script type="module" src="./chess.js"></script>
</body>
</html>
